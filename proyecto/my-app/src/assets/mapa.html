<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * { margin: 0; padding: 0; }
        html, body, #map { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        function initMap() {
            const marcadoresJson = document.getElementById('datos')?.textContent || '[]';
            const marcadores = JSON.parse(marcadoresJson);

            let centro = { lat: -33.45, lng: -70.65 };
            let zoom = 13;

            if (marcadores.length > 0) {
                const latSum = marcadores.reduce((s, m) => s + m.lat, 0);
                const lngSum = marcadores.reduce((s, m) => s + m.lng, 0);
                centro = { lat: latSum / marcadores.length, lng: lngSum / marcadores.length };
                zoom = 12;
            }

            const map = new google.maps.Map(document.getElementById('map'), {
                center: centro,
                zoom: zoom,
                mapTypeId: 'roadmap',
                styles: [
                    { elementType: 'geometry', stylers: [{ color: '#242f3e' }] },
                    { elementType: 'labels.text.stroke', stylers: [{ color: '#242f3e' }] },
                    { elementType: 'labels.text.fill', stylers: [{ color: '#746855' }] },
                    { featureType: 'road', elementType: 'geometry', stylers: [{ color: '#38414e' }] },
                    { featureType: 'water', elementType: 'geometry', stylers: [{ color: '#17263c' }] },
                ],
                disableDefaultUI: false,
                zoomControl: true,
                streetViewControl: false,
                fullscreenControl: false,
            });

            marcadores.forEach(m => {
                const marker = new google.maps.Marker({
                    position: { lat: m.lat, lng: m.lng },
                    map: map,
                    title: m.lugar,
                });

                const info = new google.maps.InfoWindow({
                    content: `<div style="color:#333;font-weight:bold;">${m.lugar}</div>`,
                });

                marker.addListener('click', () => {
                    info.open(map, marker);
                });
            });
        }
    </script>
    <script id="datos" type="application/json">[]</script>
    <script async defer
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDfj9Lh_T2ad9gAsqDYX2PNcUW4MkinjKQ&callback=initMap">
    </script>
</body>
</html>
